<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>线路跳转中…</title>
<style>
  :root{
    --bg1:#eef2ff;--bg2:#f8fafd;--glow:#8b9dff;
    --panel:rgba(255,255,255,.88);--line:rgba(20,30,70,.10);
    --text:#141a2e;--sub:#6b7590;--accent:#4f6bff;--accent2:#12c2b0;
    --ok:#12a97f;--bad:#e0564f;--track:rgba(20,30,70,.06);
    --shadow:0 18px 48px -18px rgba(28,40,90,.28);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg1:#0d1122;--bg2:#080a14;--glow:#3b4a8f;
      --panel:rgba(20,26,48,.84);--line:rgba(160,180,255,.14);
      --text:#eef1ff;--sub:#98a2c4;--accent:#7d92ff;--accent2:#2fd8c4;
      --ok:#2fd8a2;--bad:#ff7b72;--track:rgba(160,180,255,.10);
      --shadow:0 20px 60px -20px rgba(0,0,0,.7);
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;padding:20px 16px;
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--text);
    background:
      radial-gradient(880px 460px at 12% -10%,var(--glow),transparent 62%),
      radial-gradient(740px 400px at 96% 6%,var(--accent2),transparent 58%),
      linear-gradient(170deg,var(--bg1),var(--bg2));
    background-attachment:fixed;
    display:flex;align-items:center;justify-content:center;
  }
  .card{
    width:100%;max-width:560px;background:var(--panel);
    border:1px solid var(--line);border-radius:22px;
    box-shadow:var(--shadow);padding:28px 26px 20px;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    animation:rise .32s cubic-bezier(.2,.8,.25,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .logo{
    width:52px;height:52px;border-radius:16px;margin:0 auto;position:relative;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:grid;place-items:center;color:#fff;font-size:25px;
    box-shadow:0 12px 26px -10px var(--accent);
  }
  .logo::after{
    content:"";position:absolute;inset:-5px;border-radius:20px;
    border:2px solid var(--accent);opacity:.35;animation:ping 1.6s ease-out infinite;
  }
  @keyframes ping{0%{transform:scale(.85);opacity:.5}100%{transform:scale(1.28);opacity:0}}
  .msg{margin-top:18px;text-align:center;font-size:16px;font-weight:700;letter-spacing:.3px}
  .msg .txt{
    background:linear-gradient(90deg,var(--accent) 25%,var(--accent2) 50%,var(--accent) 75%);
    background-size:200% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shine 2.4s linear infinite;
  }
  @keyframes shine{to{background-position:-200% 0}}
  .dots{display:inline-block;margin-left:2px}
  .dots i{
    display:inline-block;width:4.5px;height:4.5px;border-radius:50%;
    background:var(--accent);margin:0 1.5px;vertical-align:2px;
    animation:pop 1.15s ease-in-out infinite;
  }
  .dots i:nth-child(2){animation-delay:.18s}
  .dots i:nth-child(3){animation-delay:.36s}
  @keyframes pop{0%,100%{opacity:.2;transform:translateY(0)}50%{opacity:1;transform:translateY(-3.5px)}}
  .prog{height:4px;border-radius:99px;background:var(--track);overflow:hidden;margin-top:18px}
  .prog i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .35s cubic-bezier(.2,.8,.25,1)}
  .prog i.run{width:34%;animation:slide 1.15s cubic-bezier(.5,0,.5,1) infinite}
  @keyframes slide{0%{transform:translateX(-115%)}100%{transform:translateX(320%)}}
  .sub{color:var(--sub);font-size:12.5px;text-align:center;margin:10px 0 0;display:none}
  .sub.show{display:block}
  .manual{margin-top:18px;display:none;text-align:center}
  .manual.show{display:block;animation:rise .3s both}
  .manual .big{width:100%;font-size:15px;padding:14px 18px;margin-top:12px}
  .manual .big span{font-weight:400;opacity:.85}
  .list{margin-top:14px;display:none;flex-direction:column;gap:8px;max-height:34vh;overflow:auto}
  .list.show{display:flex}
  .it{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:11px 14px;border-radius:13px;background:var(--track);
    border:1px solid transparent;animation:rise .28s both;cursor:pointer;
  }
  .it:hover{border-color:var(--accent)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--sub);flex:0 0 auto}
  .it.dead .dot{background:var(--bad)}
  .host{flex:1;min-width:0}
  .host b{display:block;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .host small{color:var(--sub);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
  .ms{text-align:right;font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--sub);flex:0 0 auto}
  .it.dead .ms{color:var(--bad)}
  .jump{
    margin-top:18px;display:none;gap:12px;align-items:center;
    padding:13px 15px;border-radius:15px;border:1px solid var(--accent);
    background:linear-gradient(90deg,rgba(79,107,255,.12),rgba(18,194,176,.06))
  }
  .jump.show{display:flex}
  .jump .txt{flex:1;min-width:0}
  .jump .txt b{display:block;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .jump .txt small{color:var(--sub);font-size:11.5px}
  .cd{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent);min-width:40px;text-align:center}
  button{
    font:inherit;font-size:13.5px;font-weight:600;border-radius:12px;cursor:pointer;
    padding:10px 18px;border:1px solid var(--line);background:var(--track);color:var(--text);
    transition:transform .14s,filter .18s
  }
  button:active{transform:scale(.97)}
  .primary{border:0;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 10px 22px -12px var(--accent)}
  .ghost{background:transparent}
  .foot{margin-top:16px;font-size:11px;color:var(--sub);text-align:center;line-height:1.7}
</style>
</head>
<body>
<div class="card">
  <div class="logo">⚡</div>

  <div class="msg"><span class="txt" id="msg">线路检测中，将选择最快的线路</span><span class="dots" id="dots"><i></i><i></i><i></i></span></div>
  <div class="prog"><i id="pi"></i></div>
  <p class="sub" id="sub"></p>

  <div class="manual" id="mn">
    <button class="primary big" id="mgo">点击进入 <span id="mh">—</span></button>
  </div>

  <div class="list" id="list"></div>

  <div class="jump" id="jp">
    <div class="cd" id="cd">1.0</div>
    <div class="txt"><b id="jh">—</b><small id="js">正在自动跳转，若未跳转请点右侧按钮</small></div>
    <button class="primary" id="now">立即进入</button>
    <button class="ghost" id="cancel">取消</button>
  </div>

  <p class="foot" id="foot">
  永远相信★★★★★美好的事情即将发生
  </p>
</div>

<script>
(function () {
  'use strict';

  /* 读取上面的配置（带默认值，即使上面漏写也不会报错） */
  var CFG = {
    SITES: (typeof SITES !== 'undefined' && Object.prototype.toString.call(SITES) === '[object Array]') ? SITES : [],
    SAMPLE: typeof SAMPLE === 'number' ? SAMPLE : 6,
    TIMEOUT: typeof TIMEOUT === 'number' ? TIMEOUT : 2500,
    MAX_TOTAL_MS: typeof MAX_TOTAL_MS === 'number' ? MAX_TOTAL_MS : 15000,
    TOLERANCE: typeof TOLERANCE === 'number' ? TOLERANCE : 0.2,
    JUMP_DELAY: typeof JUMP_DELAY === 'number' ? JUMP_DELAY : 1000,
    CONFIRM: typeof CONFIRM === 'boolean' ? CONFIRM : false
  };
  var $ = function (s) { return document.querySelector(s); };
  var elPi = $('#pi'), elSub = $('#sub'), elMsg = $('#msg'), elDots = $('#dots');
  var elList = $('#list'), elMn = $('#mn'), elMgo = $('#mgo'), elMh = $('#mh');
  var elJp = $('#jp'), elCd = $('#cd'), elJh = $('#jh'), elFoot = $('#foot');

  var state = { nodes: [], batch: [], winner: null, timer: null, tick: null, confirming: false, count: 0 };

  /* ---------- 解析网址 ---------- */
  function parse(raw) {
    var s = String(raw || '').trim();
    if (!s || s.charAt(0) === '#') return null;
    if (!/^https?:\/\//i.test(s)) s = 'https://' + s;
    try {
      var u = new URL(s);
      if (!u.hostname || u.hostname.indexOf('.') < 0) return null;
      return { url: u.href, origin: u.origin, host: u.hostname, t: null };
    } catch (e) { return null; }
  }
  function buildNodes() {
    var seen = {}, out = [];
    (CFG.SITES || []).forEach(function (raw) {
      var n = parse(raw);
      if (!n) return;
      if (seen[n.origin]) return;
      seen[n.origin] = 1; out.push(n);
    });
    return out;
  }
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  /* ---------- 探测一：no-cors 请求（主）---------- */
  function fetchProbe(origin, timeout) {
    return new Promise(function (resolve) {
      if (typeof fetch !== 'function' || typeof AbortController !== 'function') return resolve(null);
      var t0 = performance.now(), fin = false, ctl = new AbortController();
      var timer = setTimeout(function () {
        if (fin) return; fin = true; try { ctl.abort(); } catch (e) {} resolve(null);
      }, timeout);
      fetch(origin + '/?_=' + Math.random().toString(36).slice(2), {
        mode: 'no-cors', cache: 'no-store', credentials: 'omit',
        redirect: 'follow', referrerPolicy: 'no-referrer', signal: ctl.signal
      }).then(function () {
        if (fin) return; fin = true; clearTimeout(timer); resolve(performance.now() - t0);
      }).catch(function () {
        if (fin) return; fin = true; clearTimeout(timer); resolve(null);
      });
    });
  }

  /* ---------- 探测二：图标图片（兜底，兼容性最好）---------- */
  function imgProbe(origin, timeout) {
    return new Promise(function (resolve) {
      var t0 = performance.now(), fin = false;
      var img = new Image();
      var timer = setTimeout(function () { if (!fin) { fin = true; resolve(null); } }, timeout);
      img.onload = function () { if (fin) return; fin = true; clearTimeout(timer); var t = performance.now() - t0; resolve(t > 3 ? t : null); };
      img.onerror = function () { if (fin) return; fin = true; clearTimeout(timer); resolve(null); };
      img.referrerPolicy = 'no-referrer';
      img.src = origin + '/favicon.ico?_=' + Math.random().toString(36).slice(2);
    });
  }

  function measure(node, timeout) {
    return Promise.all([fetchProbe(node.origin, timeout), imgProbe(node.origin, timeout)])
      .then(function (r) {
        var vals = r.filter(function (v) { return typeof v === 'number' && v > 0; });
        var t = vals.length ? Math.min.apply(null, vals) : null;
        if (t != null) node.t = node.t == null ? t : Math.min(node.t, t);
      }, function () {})
      .then(function () {
        if (!state.confirming && state.batch.indexOf(node) >= 0) {
          state.count++;
          elPi.style.width = Math.min(100, Math.round(state.count / state.batch.length * 100)) + '%';
        }
        return node;
      });
  }

  /* ---------- 并发池 ---------- */
  function pool(items, limit, fn) {
    return new Promise(function (resolve) {
      var i = 0, active = 0, left = items.length;
      if (!left) return resolve(items);
      function next() {
        while (active < limit && i < items.length) {
          (function (idx) {
            active++; i++;
            var fin = function () { active--; left--; if (left === 0) resolve(items); else next(); };
            Promise.resolve(fn(items[idx], idx)).then(fin, fin);
          })(i);
        }
      }
      next();
    });
  }

  /* ---------- 选优：最快的一档里随机取一个 ---------- */
  function pick(nodes) {
    var ok = nodes.filter(function (n) { return n.t != null; })
                  .sort(function (a, b) { return a.t - b.t; });
    if (!ok.length) return null;
    var best = ok[0].t;
    var p = ok.filter(function (n) { return n.t <= best * (1 + Math.max(0, CFG.TOLERANCE)); });
    return p[Math.floor(Math.random() * p.length)];
  }

  /* ---------- 跳转 ---------- */
  function go(url) {
    stop();
    try { location.replace(url); } catch (e) { location.href = url; }
  }
  function stop() {
    if (state.timer) { clearTimeout(state.timer); state.timer = null; }
    if (state.tick) { clearTimeout(state.tick); state.tick = null; }
    elJp.classList.remove('show');
  }
  function countdown(url) {
    if (CFG.JUMP_DELAY <= 0) return go(url);
    var end = Date.now() + CFG.JUMP_DELAY;
    elJp.classList.add('show');
    elJh.textContent = url;
    (function tickPaint() {
      var left = Math.max(0, end - Date.now());
      elCd.textContent = (left / 1000).toFixed(1);
      if (left > 0) state.tick = setTimeout(tickPaint, 80);
    })();
    state.timer = setTimeout(function () { go(url); }, CFG.JUMP_DELAY);
  }

  /* ---------- 手动选择面板（列线路用） ---------- */
  function showList(nodes) {
    var sorted = nodes.slice().sort(function (a, b) {
      return (a.t == null ? 1e9 : a.t) - (b.t == null ? 1e9 : b.t);
    });
    elList.innerHTML = '';
    elList.classList.add('show');
    sorted.forEach(function (n, i) {
      var d = document.createElement('div');
      d.className = 'it' + (n.t == null ? ' dead' : '');
      d.style.animationDelay = Math.min(i * 25, 300) + 'ms';
      d.innerHTML = '<span class="dot"></span><span class="host"><b></b><small></small></span><span class="ms"></span>';
      d.querySelector('b').textContent = n.host;
      d.querySelector('small').textContent = n.url;
      d.querySelector('.ms').textContent = n.t == null ? '超时' : Math.round(n.t) + ' ms';
      d.addEventListener('click', function () { go(n.url); });
      elList.appendChild(d);
    });
  }

  /* ---------- 全部不可达：随机给一条让用户手动点 ---------- */
  function allDead(tested, note) {
    var rnd = tested[Math.floor(Math.random() * tested.length)];
    elPi.classList.remove('run');
    elPi.style.width = '100%';
    elMsg.textContent = '所有线路均不可达';
    elDots.style.display = 'none';
    elSub.textContent = note || ('已检测 ' + tested.length + ' 条线路，均无响应，请手动选择一条');
    elSub.classList.add('show');
    elMh.textContent = rnd.host;
    elMgo.dataset.url = rnd.url;
    elMn.classList.add('show');
    showList(tested);
    elFoot.innerHTML = '随机推荐一条线路，点击上方按钮或下方列表即可进入。<br>若仍打不开，请稍后刷新本页重试。';
  }

  /* ---------- 主流程：抽样检测 ---------- */
  function boot() {
    state.nodes = buildNodes();
    if (!state.nodes.length) {
      elMsg.textContent = '还没配置线路';
      elDots.style.display = 'none';
      elPi.style.display = 'none';
      elSub.textContent = '请在源码【第 ① 个 script（配置区）】的 SITES 数组里填入要跳转的网址';
      elSub.classList.add('show');
      elFoot.innerHTML = '打开本 HTML 文件，找到<b>第 ① 个 script 标签</b>（配置区），把网址填进 <b>SITES = [ ... ]</b>（每行一个），保存后刷新即可。<br>第 ② 个 script 是执行逻辑，别动它。';
      return;
    }
    // 只有一条线路：无需测速，直接走
    if (state.nodes.length === 1) {
      elPi.style.width = '100%';
      countdown(state.nodes[0].url);
      return;
    }

    var size = state.nodes.length <= CFG.SAMPLE ? state.nodes.length : CFG.SAMPLE;
    var queue = shuffle(state.nodes.slice());   // 打乱，保证抽样随机
    var tested = [];
    var total = state.nodes.length;
    var t0 = Date.now();
    var known = total <= CFG.SAMPLE;            // 是否已知总数（决定进度条是确定型还是扫描型）
    if (!known) elPi.classList.add('run');

    function nextBatch() {
      if (!queue.length) return allDead(tested);
      if (Date.now() - t0 > CFG.MAX_TOTAL_MS) {
        return allDead(tested, '已检测 ' + tested.length + '/' + total + ' 条线路，耗时过长已停止，请手动选择');
      }
      var batch = queue.splice(0, size);
      state.batch = batch;
      state.count = 0;
      elPi.style.width = '0%';
      pool(batch, Math.min(12, batch.length), function (n) { return measure(n, CFG.TIMEOUT); })
        .then(function () {
          tested = tested.concat(batch);
          var alive = batch.filter(function (n) { return n.t != null; });
          if (!alive.length) return nextBatch();   // 这一批全挂，换下一批
          elPi.classList.remove('run');
          elPi.style.width = '100%';
          // 若开启复测：对这批里最快的 3 条再确认一次
          if (!CFG.CONFIRM || alive.length < 2) return done(alive);
          state.confirming = true;
          var top = alive.slice().sort(function (a, b) { return a.t - b.t; }).slice(0, 3);
          pool(top, 3, function (n) { return measure(n, Math.max(600, CFG.TIMEOUT / 2)); })
            .then(function () { state.confirming = false; done(alive); });
        });
    }
    function done(alive) {
      var win = pick(alive);
      state.winner = win;
      countdown(win.url);
    }
    nextBatch();
  }

  $('#mgo').addEventListener('click', function () { go(this.dataset.url); });
  $('#now').addEventListener('click', function () { if (state.winner) go(state.winner.url); });
  $('#cancel').addEventListener('click', function () {
    stop();
    elMsg.textContent = '已取消自动跳转';
    elDots.style.display = 'none';
    elSub.textContent = '点击下方任意线路即可进入';
    elSub.classList.add('show');
    showList(state.batch.length ? state.batch : state.nodes);
  });
  window.addEventListener('beforeunload', stop);

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
